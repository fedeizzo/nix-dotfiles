[package]
name = "calliope"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.3", features = ["derive"] }
epub = "2.1.5"
hound = "3.5.1"
indicatif = "0.18.6"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.3"
unicode-segmentation = "1.13.3"

[lints.clippy]
pedantic = "warn"

