[package]
name = "pan"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0.103"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["full"] }
rig = "0.40.0"
reqwest = "0.13.4"
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
chrono = { version = "0.4.45", features = ["serde"] }

[lints.clippy]
pedantic = "warn"

[dev-dependencies]
rstest = "0.26.1"
wiremock = "0.6.5"
